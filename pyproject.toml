[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cxr-gnn"
version = "1.0.0"
description = "Superpixel GATv2 + hybrid CNN pipeline for 5-class chest X-ray classification"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "torch>=2.0",
    "torchvision>=0.15",
    "torch-geometric>=2.4",
]

[project.optional-dependencies]
# statsmodels only supplies McNemar's exact test; stats.py falls back to an
# exact binomial test through scipy when it is absent.
stats = ["statsmodels>=0.14"]
# imageio backs the JPEG-compression perturbation in the robustness study.
robustness = ["imageio>=2.31"]
dev = ["pytest>=7.4", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.25"]

[project.scripts]
cxr-train = "train:main"

[tool.setuptools]
packages = ["cxr_gnn", "cxr_gnn.data", "cxr_gnn.models", "cxr_gnn.training", "cxr_gnn.evaluation"]
py-modules = ["train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
